name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Интерактивный вызов: только человек с правами на запись, только с явной командой /oc|/opencode.
    # Проверка user.type == 'User' исключает ботов и сам агент (opencode-agent[bot]),
    # тем самым разрывается петля «комментарий агента → новый прогон».
    # author_association — чтобы не тратить прогон на пользователей без write-permissions
    # (handler упадёт на assertPermissions).
    if: |
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, ' /oc') ||
       contains(github.event.comment.body, '\n/oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       contains(github.event.comment.body, '\n/opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN НЕ имеет скоупа `workflows` (это не валидный scope — см. документацию
      # по GITHUB_TOKEN), поэтому агент физически не может коммитить изменения в
      # .github/workflows/*. Интерактивный агент работает с кодом/документацией PR,
      # а workflow-файлы правит человек обычным коммитом.
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Не оставляем учётные данные в .git/config — авторизация git настраивается
          # явно ниже, только на время прогона.
          persist-credentials: false

      - name: Configure git auth and identity
        # Авторизация аналогична той, что actions/checkout писал раньше в .git/config:
        # basic x-access-token:<GITHUB_TOKEN>. Делаем explicit, чтобы агент мог коммитить
        # и пушить, не полагаясь на неявные учётные данные с раннера. Runner эфемерный —
        # в .git/config креды живут только до конца прогона.
        run: |
          git config --local user.name "opencode[bot]"
          git config --local user.email "opencode[bot]@users.noreply.github.com"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          USE_GITHUB_TOKEN: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          use_github_token: true
          model: opencode/big-pickle
          # Сессии не публикуем на opencode.ai (репозиторий публичный) — явное решение.
          share: false
          # Явно закрепляем команды вызова (по умолчанию они и так /oc,/opencode).
          mentions: /oc,/opencode
