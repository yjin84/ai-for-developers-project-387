name: lighthouse

on:
  schedule:
    # 02:00 по Москве (UTC+3) = 23:00 UTC предыдущего дня.
    # Ночной прогон, утром команда смотрит отчёт в артефактах и Step Summary.
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Агент OpenCode ничего не пушит (промпт запрещает коммиты; отчёты
          # lighthouse-reports/ в .gitignore, поэтому дерево остаётся чистым и
          # хендлер не идёт в ветку/PR). Креды в .git/config не кладём.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      # Аудитируем e2e-сборку (mode test): MSW-воркер отдаёт детерминированные
      # мок-данные, поэтому отчёт стабилен и не зависит от живого бэкенда.
      - name: Build frontend (test mode with MSW)
        run: npm run build:e2e

      - name: Serve production build
        run: |
          nohup npm run preview:e2e > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -f http://127.0.0.1:4173/ > /dev/null

      # Lighthouse CLI: HTML-отчёт для просмотра утром + JSON для сводки.
      # Chrome предустановлен на ubuntu-latest раннерах.
      - name: Run Lighthouse
        run: |
          mkdir -p lighthouse-reports
          for page in "/:index" "/book:book" "/admin:admin"; do
            url="${page%%:*}"
            name="${page##*:}"
            npx --yes lighthouse@latest "http://127.0.0.1:4173${url}" \
              --output=json --output=html \
              --output-path="lighthouse-reports/${name}" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless=new --no-sandbox" \
              --quiet
          done

      # Краткая сводка с оценками — видна прямо в Run Summary без скачивания.
      - name: Write scores summary
        run: |
          {
            echo "## Lighthouse — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| Страница | Performance | Accessibility | Best Practices | SEO |"
            echo "|---|---|---|---|---|"
            for f in lighthouse-reports/*.report.json; do
              node -e '
                const [, file, label] = process.argv;
                // Читаем через fs: require() без префикса ./ ищет пакет в node_modules,
                // а не относительный путь (причина падения прогона 32510791880).
                const { categories } = JSON.parse(require("fs").readFileSync(file, "utf8"));
                const pct = (k) => Math.round((categories[k].score ?? 0) * 100);
                console.log(`| ${label} | ${pct("performance")} | ${pct("accessibility")} | ${pct("best-practices")} | ${pct("seo")} |`);
              ' "$f" "$(basename "$f" .report.json)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Регулярный сценарий OpenCode: агент анализирует готовые отчёты Lighthouse
      # (они созданы в шагах выше) и решает, создавать ли issue по регрессии.
      # Для schedule/workflow_dispatch PROMPT обязателен; way=repo, поэтому итог
      # виден в логах прогона, а issue создаётся агентом через gh (если нужно).
      - name: Analyze Lighthouse report with OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          USE_GITHUB_TOKEN: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: opencode/big-pickle
          share: false
          mentions: /oc,/opencode
          prompt: |
            Ночной прогон Lighthouse завершён. Проанализируй JSON-отчёты в
            frontend/lighthouse-reports/*.report.json (страницы index, book, admin;
            категории performance, accessibility, best-practices, seo).

            Действия:
            1. Выпиши оценки по каждой странице и категории.
            2. Если какая-то оценка упала ниже 0.9 или есть явная регрессия против
               типичного уровня: сначала проверь через `gh issue list --search "Lighthouse: регрессия"`,
               есть ли уже открытая issue по регрессии. Если есть — не создавай новую
               (добавь комментарий в существующую). Если нет — создай через
               `gh issue create` с заголовком "Lighthouse: регрессия" и списком проблем
               (страница, категория, оценка).
            3. Не изменяй код и не коммить ничего — отчёт уже сохранён в артефактах.
            Ответ — краткое резюме по пунктам.

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: frontend/lighthouse-reports/
          retention-days: 90
